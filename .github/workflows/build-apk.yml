name: Build Courser APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup local.properties
        run: |
          touch local.properties
          if [ -n "${{ secrets.GDRIVE_WEB_CLIENT_ID }}" ]; then
            echo "GDRIVE_WEB_CLIENT_ID=${{ secrets.GDRIVE_WEB_CLIENT_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}" ]; then
            echo "GDRIVE_WEB_CLIENT_SECRET=${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}" >> local.properties
          fi

      - name: Decode Release Keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > courser-upload.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=courser-upload.jks" >> keystore.properties

      - name: Prepare Output Directory
        run: mkdir -p build-apks

      - name: Build Debug APK (Universal)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'both' || inputs.build_type == 'debug' }}
        run: |
          ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=false --no-daemon --console=plain
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/Courser-debug.apk
          fi

      - name: Build Release APK (Universal)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'both' || inputs.build_type == 'release' }}
        run: |
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=false --no-daemon --console=plain
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/Courser-release.apk
          fi

      - name: Build Architecture Split Release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'both' || inputs.build_type == 'release' }}
        run: |
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true --no-daemon --console=plain
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk build-apks/Courser-release-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-armeabi-v7a-release.apk ]; then
            cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk build-apks/Courser-release-armeabi-v7a.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Courser-APKs
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} build-apks/*.apk \
            --title "Courser ${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload ${{ github.ref_name }} build-apks/*.apk --clobber
