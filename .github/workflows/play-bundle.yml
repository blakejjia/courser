name: Build Play Store Bundle (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  bundle:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > courser-upload.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=courser-upload.jks" >> keystore.properties

      - name: Setup local.properties
        run: |
          echo "GDRIVE_WEB_CLIENT_ID=${{ secrets.GDRIVE_WEB_CLIENT_ID }}" >> local.properties
          echo "GDRIVE_WEB_CLIENT_SECRET=${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}" >> local.properties

      - name: Build Release App Bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Courser-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
